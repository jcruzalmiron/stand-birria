<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos del Evento · dividí fácil</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--acc:#7C5CCC;--acc2:#9d82e8;--bg:#101018;--card:#181824;--bord:#28283a}
  body{background:var(--bg);color:#eee;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding-bottom:100px}
  header{padding:22px 18px 10px;text-align:center}
  h1{font-size:22px}h1 span{color:var(--acc2)}
  .sub{font-size:13px;color:#888;margin-top:4px}
  .tabs{display:flex;gap:8px;padding:14px;position:sticky;top:0;background:var(--bg);z-index:5}
  .tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bord);background:var(--card);color:#aaa;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:46px}
  .tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .vista{padding:0 14px;display:flex;flex-direction:column;gap:10px}
  .hidden{display:none}
  .gasto{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
  .gicon{width:42px;height:42px;border-radius:12px;background:#23233a;display:flex;align-items:center;justify-content:center;font-size:20px}
  .ginfo{flex:1}.gdesc{font-weight:700;font-size:15px}.gquien{font-size:12.5px;color:#888;margin-top:2px}
  .gmonto{font-weight:800;color:var(--acc2);font-size:16px}
  .balance{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:14px}
  .btop{display:flex;justify-content:space-between;margin-bottom:8px;font-size:15px}
  .btop b.pos{color:#7ee0a3}.btop b.neg{color:#ff6a5e}
  .barra{height:12px;background:#23233a;border-radius:8px;overflow:hidden;position:relative}
  .barra .fill{height:100%;border-radius:8px;transition:width .5s}
  .fill.pos{background:linear-gradient(90deg,#3fae6a,#7ee0a3)}.fill.neg{background:linear-gradient(90deg,#c0392b,#ff6a5e)}
  .bnota{font-size:12px;color:#777;margin-top:6px}
  .transfer{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;font-size:15px}
  .transfer .flecha{color:var(--acc2);font-size:20px}
  .transfer b{color:#fff}.transfer .m{margin-left:auto;font-weight:800;color:#7ee0a3;font-size:17px}
  .resumen{background:linear-gradient(135deg,#221a3a,#181824);border:1px solid #34295a;border-radius:16px;padding:16px;text-align:center}
  .resumen .tot{font-size:30px;font-weight:800;color:var(--acc2)}
  .resumen .l{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  .fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:none;border-radius:999px;padding:16px 28px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 8px 28px rgba(124,92,204,.4)}
  .fab:active{transform:translateX(-50%) scale(.95)}
  dialog{margin:auto;background:#1c1c2c;color:#eee;border:1px solid #33334d;border-radius:20px;padding:24px;width:min(92vw,380px)}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  dialog h3{margin-bottom:14px}
  dialog label{display:block;font-size:13px;color:#999;margin:12px 0 4px}
  dialog input,dialog select{width:100%;background:#12121e;border:1px solid #33334d;border-radius:10px;padding:12px;color:#eee;font-size:16px;font-family:inherit}
  .dbtns{display:flex;gap:10px;margin-top:20px}
  .dbtns button{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .ok{background:var(--acc);color:#fff}.cancel{background:#28283a;color:#ccc}
  .listo{text-align:center;color:#7ee0a3;padding:26px;font-size:16px}
</style>
</head>
<body>
<header>
  <h1>💸 Gastos del <span>Evento</span></h1>
  <div class="sub">4 amigos · todo dividido en partes iguales</div>
</header>
<div class="tabs">
  <button class="tab on" data-v="vGastos">Gastos</button>
  <button class="tab" data-v="vBalances">Balances</button>
  <button class="tab" data-v="vSaldar">Saldar</button>
</div>

<div class="vista" id="vGastos"></div>
<div class="vista hidden" id="vBalances"></div>
<div class="vista hidden" id="vSaldar"></div>

<button class="fab" onclick="dlg.showModal()">＋ Agregar gasto</button>

<dialog id="dlg">
  <h3>Nuevo gasto</h3>
  <label>¿Qué compraron?</label><input id="fDesc" placeholder="Ej: hielo, carbón...">
  <label>¿Cuánto salió? (ARS)</label><input id="fMonto" type="number" inputmode="numeric" placeholder="15000">
  <label>¿Quién pagó?</label><select id="fQuien"></select>
  <div class="dbtns">
    <button class="cancel" onclick="dlg.close()">Cancelar</button>
    <button class="ok" onclick="agregar()">Guardar</button>
  </div>
</dialog>

<script>
const ars=n=>'$'+Math.round(n).toLocaleString('es-AR');
const PERSONAS=['Juan','Flor','Tomi','Meli'];
let gastos=[
  {desc:'Birria y tortillas',monto:48000,quien:'Juan',icon:'🌮'},
  {desc:'Bebidas',monto:32500,quien:'Flor',icon:'🍻'},
  {desc:'Carbón y hielo',monto:14800,quien:'Tomi',icon:'🔥'},
  {desc:'Decoración del stand',monto:21000,quien:'Meli',icon:'🎈'},
  {desc:'Nafta del flete',monto:12000,quien:'Juan',icon:'⛽'},
];
const ICONS=['🛒','🥤','🍕','🎟️','🧊','🎶','🧻','🍰'];
PERSONAS.forEach(p=>{const o=document.createElement('option');o.textContent=p;fQuien.appendChild(o);});

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.vista').forEach(x=>x.classList.add('hidden'));
  b.classList.add('on');
  document.getElementById(b.dataset.v).classList.remove('hidden');
  render();
});
function agregar(){
  const d=fDesc.value.trim(), m=parseFloat(fMonto.value);
  if(!d||!m||m<=0){fDesc.placeholder='⚠️ Completá descripción y monto';return;}
  gastos.push({desc:d,monto:m,quien:fQuien.value,icon:ICONS[Math.floor(Math.random()*ICONS.length)]});
  fDesc.value='';fMonto.value='';dlg.close();render();
}
function balances(){
  const tot=gastos.reduce((a,g)=>a+g.monto,0), cuota=tot/PERSONAS.length;
  return PERSONAS.map(p=>({p, pago:gastos.filter(g=>g.quien===p).reduce((a,g)=>a+g.monto,0)}))
                 .map(x=>({...x, saldo:x.pago-cuota}));
}
function render(){
  const tot=gastos.reduce((a,g)=>a+g.monto,0);
  // gastos
  vGastos.innerHTML='<div class="resumen"><div class="tot">'+ars(tot)+'</div><div class="l">total · '+ars(tot/4)+' por persona</div></div>';
  [...gastos].reverse().forEach(g=>{
    vGastos.insertAdjacentHTML('beforeend','<div class="gasto"><div class="gicon">'+g.icon+'</div><div class="ginfo"><div class="gdesc">'+g.desc+'</div><div class="gquien">pagó '+g.quien+'</div></div><div class="gmonto">'+ars(g.monto)+'</div></div>');
  });
  // balances
  const bals=balances(), maxAbs=Math.max(...bals.map(b=>Math.abs(b.saldo)),1);
  vBalances.innerHTML='';
  bals.forEach(b=>{
    const pos=b.saldo>=0, w=Math.abs(b.saldo)/maxAbs*100;
    vBalances.insertAdjacentHTML('beforeend',
      '<div class="balance"><div class="btop"><span>'+b.p+'</span><b class="'+(pos?'pos':'neg')+'">'+(pos?'+':'−')+ars(Math.abs(b.saldo))+'</b></div>'+
      '<div class="barra"><div class="fill '+(pos?'pos':'neg')+'" style="width:'+w+'%"></div></div>'+
      '<div class="bnota">pagó '+ars(b.pago)+' de '+ars(tot/4)+' que le tocaban</div></div>');
  });
  // saldar: transferencias mínimas (greedy deudor mayor → acreedor mayor)
  let deudores=bals.filter(b=>b.saldo<-0.5).map(b=>({p:b.p,m:-b.saldo})).sort((a,b)=>b.m-a.m);
  let acreedores=bals.filter(b=>b.saldo>0.5).map(b=>({p:b.p,m:b.saldo})).sort((a,b)=>b.m-a.m);
  const transf=[];
  let i=0,j=0;
  while(i<deudores.length&&j<acreedores.length){
    const m=Math.min(deudores[i].m,acreedores[j].m);
    transf.push({de:deudores[i].p,a:acreedores[j].p,m});
    deudores[i].m-=m;acreedores[j].m-=m;
    if(deudores[i].m<0.5)i++;
    if(acreedores[j].m<0.5)j++;
  }
  vSaldar.innerHTML = transf.length
    ? '<div class="bnota" style="padding:0 4px">Con solo '+transf.length+' transferencia'+(transf.length>1?'s':'')+' quedan todos a mano:</div>'+
      transf.map(t=>'<div class="transfer"><b>'+t.de+'</b><span class="flecha">→</span><b>'+t.a+'</b><span class="m">'+ars(t.m)+'</span></div>').join('')
    : '<div class="listo">✅ ¡Están todos a mano!</div>';
}
render();
</script>
</body>
</html>
