<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04060c">
<title>Claude en tu mundo · 3° Degustación Birria</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04060c;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;color:#eaf4ff}
  body{display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(1000px 520px at 80% -10%, rgba(93,60,180,.22), transparent 60%),
      radial-gradient(800px 460px at 0% 110%, rgba(20,120,160,.16), transparent 60%),
      #04060c}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.4;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3.2vh;padding:7vw;text-align:center;opacity:0;transform:scale(.97);transition:opacity .8s,transform .8s;pointer-events:none}
  .card.on{opacity:1;transform:scale(1)}
  .icono{font-size:clamp(64px,13vh,130px);filter:drop-shadow(0 0 30px rgba(255,255,255,.12))}
  .industria{font-size:clamp(13px,2.4vh,22px);font-weight:800;text-transform:uppercase;letter-spacing:7px;
    display:flex;align-items:center;gap:14px}
  .industria::before,.industria::after{content:'';width:34px;height:2px;background:currentColor;box-shadow:0 0 10px currentColor}
  .caso{font-size:clamp(26px,5.4vh,56px);font-weight:800;line-height:1.3;max-width:19em;color:#fff;letter-spacing:-.3px}
  .herr{font-size:clamp(13px,2vh,18px);font-weight:700;color:#8aa3bd;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .herr span{padding:7px 16px;border-radius:999px;border:1px solid;letter-spacing:1px}
  .pie{position:fixed;bottom:24px;width:100%;text-align:center;font-size:clamp(12px,1.7vh,17px);color:#3d5a7a;letter-spacing:2px;z-index:10}
  .pie b{color:#9d82e8}
  .dots{position:fixed;top:28px;width:100%;display:flex;justify-content:center;gap:10px;z-index:10}
  .dot{width:9px;height:9px;border-radius:50%;background:#15233a;border:1px solid #24405e;transition:.4s}
  .dot.on{background:#5fd9ff;border-color:#5fd9ff;box-shadow:0 0 12px #5fd9ff;transform:scale(1.25)}
  .barra{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#5fd9ff,#9d82e8);width:0;z-index:10;box-shadow:0 0 12px rgba(95,217,255,.6)}
  @keyframes carga{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div class="barra" id="barra"></div>
<div class="dots" id="dots"></div>
<div id="cards"></div>
<div class="pie">3° Degustación Birria · <b>Claude Fable 5</b> · pasá por el stand y armá tu pedido</div>

<script>
"use strict";
const TARJETAS=[
  {i:'🩺',ind:'Salud',col:'#5fd9ff',
   caso:'Un consultorio le pidió su sistema de turnos y recordatorios. Lo tuvo esa misma tarde.',
   herr:['PROMPT','CLAUDE CODE']},
  {i:'🍳',ind:'Gastronomía',col:'#ff9d5c',
   caso:'Comandas de cocina conectadas a los pedidos del delivery, en tiempo real.',
   herr:['PROMPT','MCP','CLAUDE CODE']},
  {i:'🛍️',ind:'Comercio',col:'#6cf0a8',
   caso:'Stock con alertas, registro de ventas en un toque y el total del día. Sin planillas.',
   herr:['PROMPT','CLAUDE CODE']},
  {i:'📚',ind:'Educación',col:'#ffce5c',
   caso:'Una docente pidió un juego para repasar fracciones. Sus alumnos lo jugaron al día siguiente.',
   herr:['PROMPT','ARTIFACTS']},
  {i:'🏠',ind:'Inmobiliaria',col:'#ff6ec1',
   caso:'Fichas de propiedades redactadas, precios comparados y el tour de visitas armado solo.',
   herr:['VISIÓN','BÚSQUEDA WEB','SKILLS']},
  {i:'🔧',ind:'Oficios',col:'#9d82e8',
   caso:'Un gasista le dicta los trabajos del día y recibe presupuestos prolijos listos para mandar.',
   herr:['SKILLS','DOCUMENTOS']},
];
const INTERVALO=8000;
const cards=document.getElementById('cards'),dots=document.getElementById('dots');
TARJETAS.forEach(t=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="icono">'+t.i+'</div>'+
    '<div class="industria" style="color:'+t.col+'">'+t.ind+'</div>'+
    '<div class="caso">'+t.caso+'</div>'+
    '<div class="herr">'+t.herr.map(h=>'<span style="color:'+t.col+';border-color:'+t.col+'55;background:'+t.col+'10">'+h+'</span>').join('')+'</div>';
  cards.appendChild(c);
  const d=document.createElement('div');d.className='dot';dots.appendChild(d);
});
let k=0;
function mostrar(){
  [...cards.children].forEach((c,i)=>c.classList.toggle('on',i===k));
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===k));
  const b=document.getElementById('barra');
  b.style.animation='none';void b.offsetWidth;
  b.style.animation='carga '+INTERVALO+'ms linear';
  k=(k+1)%TARJETAS.length;
}
mostrar();
setInterval(mostrar,INTERVALO);
</script>
</body>
</html>
